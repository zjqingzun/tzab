syntax = "proto3";
package zerotrust.zt.v1;

option go_package = "zerotrust/x/zt/types";

// Grant defines the Grant message.
message Grant {
  string grant_id = 1;
  string subject = 2;
  string resource = 3;
  string action = 4;
  string grantor = 5;
  string status = 6;
  int64 expires_at = 7;
  int64 created_at = 8;
  int64 revoked_at = 9;
}
